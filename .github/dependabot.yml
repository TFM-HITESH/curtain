version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: build
      include: scope
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels: [dependencies, "area: ci"]
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
