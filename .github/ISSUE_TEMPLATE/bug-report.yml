name: Bug report
description: Something in Curtain itself isn't working, such as the popup, the PIN, settings or the keyboard shortcut.
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        If hidden content is showing on a site, use the **A site changed or something is showing** form instead.
        To report a security vulnerability, use [private vulnerability reporting](https://github.com/TFM-HITESH/curtain/security/advisories/new), not a public issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Curtain popup
        2. …
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste the details from the Curtain popup (Report a problem → Copy details), or give your Curtain version, browser and operating system.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: This report and any screenshots contain no chat titles, chat content or personal information.
          required: true
