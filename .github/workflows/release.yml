name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release # holds RELEASE_PLEASE_TOKEN; only main can deploy to it
    permissions: {} # release-please authenticates with RELEASE_PLEASE_TOKEN, not GITHUB_TOKEN
    env:
      # A maintainer's fine-grained token, so release pull requests run the required checks
      # and are opened by the maintainer. Releases are skipped until it is configured.
      HAS_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Skip without a release token
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::RELEASE_PLEASE_TOKEN isn't configured, so no release pull request is opened."

      - name: Update the release pull request or create a release
        id: release
        if: env.HAS_TOKEN == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  build:
    name: Build and attest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # to upload assets to the draft release and publish it
      id-token: write # to sign the provenance attestation
      attestations: write # to store the provenance attestation
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # No dependency cache: release builds always start from a clean install.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build the extension zip
        run: pnpm zip

      - name: Compute checksums
        working-directory: .output
        run: sha256sum -- *.zip > SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .output/*.zip

      - name: Upload assets and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG" .output/*.zip .output/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"

  chrome:
    name: Publish to the Chrome Web Store
    needs: [release-please, build]
    if: vars.CHROME_EXTENSION_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: store
    permissions:
      contents: read # to check out the repository and download release assets
      attestations: read # to verify the release zip before uploading it
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download and verify the release zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release download "$TAG" --pattern '*-chrome.zip' --dir release --repo "$GITHUB_REPOSITORY"
          gh attestation verify release/*-chrome.zip --repo "$GITHUB_REPOSITORY"

      - name: Submit for review
        env:
          EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_EMAIL }}
          PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: |
          pnpm exec wxt submit \
            --chrome-api-version v2 \
            --chrome-zip release/*-chrome.zip \
            --chrome-extension-id "$EXTENSION_ID" \
            --chrome-publisher-id "$PUBLISHER_ID" \
            --chrome-service-account-client-email "$CLIENT_EMAIL" \
            --chrome-service-account-private-key "$PRIVATE_KEY"

  edge:
    name: Publish to Microsoft Edge Add-ons
    needs: [release-please, build]
    if: vars.EDGE_PRODUCT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: store
    permissions:
      contents: read # to check out the repository and download release assets
      attestations: read # to verify the release zip before uploading it
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download and verify the release zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release download "$TAG" --pattern '*-chrome.zip' --dir release --repo "$GITHUB_REPOSITORY"
          gh attestation verify release/*-chrome.zip --repo "$GITHUB_REPOSITORY"

      - name: Submit for review
        env:
          PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          pnpm exec wxt submit \
            --edge-zip release/*-chrome.zip \
            --edge-product-id "$PRODUCT_ID" \
            --edge-client-id "$CLIENT_ID" \
            --edge-api-key "$API_KEY"
